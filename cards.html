<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cell Question Cards</title>
<style>
  @page { size: letter; margin: 0.4in; }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #fff; color: #111; }
  .tip { padding: 12px 16px; font-size: 14px; color: #444; }
  @media print { .tip { display: none; } }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .card {
    height: 2.35in; border: 1px dashed #999; display: flex; flex-direction: column;
    align-items: center; justify-content: center; page-break-inside: avoid;
  }
  .card .top { font-size: 13px; letter-spacing: 3px; color: #2a7a45; }
  .card .num { font-size: 80px; font-weight: bold; line-height: 1.1; }
  .card .hint { font-size: 12px; color: #666; }
</style>
</head>
<body>
<div class="tip">Print this page (Ctrl+P), then cut along the dashed lines. 30 cards, 9 per page.</div>
<div class="grid" id="grid"></div>
<script>
  const g = document.getElementById("grid");
  for (let i = 1; i <= 30; i++) {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<div class="top">CELL CARD</div><div class="num">${i}</div><div class="hint">type this number in the terminal</div>`;
    g.appendChild(c);
  }
</script>
</body>
</html>
